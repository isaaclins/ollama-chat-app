name: "Feature Request ✨"
about: Suggest an idea for this project
labels: enhancement
assignees: isaaclins
body:
  - type: markdown
    attributes:
      value: |
        **Thanks for suggesting an idea to improve this project!**
  - type: textarea
    id: feature
    attributes:
      label: Describe the feature
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this feature needed?
      description: Explain why this feature should be added and what problem it solves.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Tell us about other solutions you've tried or researched.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here. 
